name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npx tsgo --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: "p/owasp-top-ten"

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify ADR index in sync
        run: |
          missing=0
          for f in docs/adr/0*.md; do
            base=$(basename "$f")
            if ! grep -q "$base" docs/adr/README.md; then
              echo "Missing ADR entry: $base"
              missing=1
            fi
          done
          exit $missing
      - name: Verify Sprint 1A plan present
        run: test -f docs/sprints/SPRINT_1A.md
