[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-guardian"
version = "0.1.0"
description = "Adaptive Continuous User Authentication using Behavioral Biometrics — Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.30",
    "motor>=3.5,<3.8",
    "beanie>=1.27,<2",
    "pymongo>=4.7,<4.12",
    "redis>=5.0",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.0,<6",
    "python-multipart>=0.0.9",
    "prometheus-fastapi-instrumentator>=7.0",
    "httpx>=0.27",
    "numpy>=2.0",
    "pandas>=2.2",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "shap>=0.46",
    "joblib>=1.4",
    "imbalanced-learn>=0.12",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.11",
    "mypy>=1.10",
    "gunicorn>=22.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"src/app/domain/*/mock_data.py" = ["E501"]
"src/app/domain/*/service.py" = ["E501"]
"src/app/domain/*/router.py" = ["E501"]
"src/app/domain/*/repository.py" = ["E501", "E712"]
"src/app/config.py" = ["E501"]
"src/app/api/errors.py" = ["E501"]
"src/app/ml/*.py" = ["E501"]
"src/tests/**/*.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
strict = true
python_version = "3.11"
ignore_missing_imports = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["src/tests"]
